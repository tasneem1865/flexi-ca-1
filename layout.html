<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Layout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .box {
      padding: 20px;
      color: white;
      text-align: center;
      font-weight: bold;
    }

    .header { background-color: #2ecc71; }
    .menu   { background-color: #1abc9c; }
    .hero   { background-color: #3498db; min-height: 300px; }
    .main   { background-color: #2c3e50; min-height: 135px; }
    .image  { background-color: #e91e63; min-height: 135px; }
    .extra  { background-color: #7f8c8d; min-height: 135px; }
    .banner { background-color: #9b59b6; padding: 30px; font-size: 20px; width: 100vw; }

    .container {
      display: flex;
      flex-direction: column;
    }

    .top-bar,
    .content-row {
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .top-bar {
        flex-direction: row;
      }

      .header {
        width: 30%;
      }

      .menu {
        width: 70%;
      }

      .hero {
        width: 100%;
      }

      .content-row {
        flex-direction: row;
        justify-content: space-between;
      }

      .main {
        width: 50%;
      }

      .right-column {
        width: 30%;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .banner {
        margin-top: 0;
      }
    }

  
    @media (max-width: 767px) {
      .top-bar,
      .content-row,
      .right-column {
        flex-direction: column !important;
        display: flex !important;
        width: 100% !important;
      }

      .main,
      .image,
      .extra,
      .header,
      .menu,
      .hero,
      .banner {
        width: 100% !important;
      }
    }

 
    @media screen and (max-width: 375px) and (max-height: 667px) {
      body {
        font-size: 14px;
      }

      .box {
        padding: 16px;
      }

      .hero {
        min-height: 200px;
      }

      .main,
      .image,
      .extra {
        min-height: 100px;
      }

      .banner {
        font-size: 18px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
  
    <div class="top-bar">
      <div class="box header">HEADER</div>
      <div class="box menu">MENU</div>
    </div>

  
    <div class="box hero">HERO</div>

    <div class="content-row">
      <div class="box main">MAIN</div>
      <div class="right-column">
        <div class="box image">IMAGE</div>
        <div class="box extra">EXTRA</div>
      </div>
    </div>

    
    <div class="box banner">BANNER</div>
  </div>

</body>
</html>
